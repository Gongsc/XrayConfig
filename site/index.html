<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="每天 60 秒，浏览今日值得关注的世界新闻。">
    <meta name="theme-color" content="#f4f0e8">
    <title>60 秒读世界</title>
    <link rel="stylesheet" href="/style.css">
    <script src="/app.js" defer></script>
  </head>
  <body>
    <header class="masthead">
      <a class="brand" href="/" aria-label="60 秒读世界首页">
        <span class="brand-mark" aria-hidden="true">60</span>
        <span class="brand-copy">
          <strong>秒读世界</strong>
          <span>一分钟 · 知天下</span>
        </span>
      </a>
      <p class="today" id="today">今日简报</p>
    </header>

    <main>
      <section class="intro" aria-labelledby="page-title">
        <div>
          <p class="kicker">DAILY BRIEFING</p>
          <h1 id="page-title">今天，世界发生了什么？</h1>
          <p class="summary">用一杯咖啡的片刻，读完今日值得关注的消息。</p>
        </div>

        <div class="edition" aria-label="本期信息">
          <span class="edition-label">本期</span>
          <strong id="edition-count">正在整理</strong>
          <span id="edition-meta">请稍候</span>
        </div>
      </section>

      <div class="toolbar">
        <p class="status" id="status" role="status" aria-live="polite">正在获取今日简报…</p>
        <button class="refresh-button" id="refresh" type="button">
          <svg aria-hidden="true" viewBox="0 0 24 24" width="18" height="18">
            <path d="M20 11a8 8 0 1 0-2.34 5.66M20 4v7h-7" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8"/>
          </svg>
          <span>刷新简报</span>
        </button>
      </div>

      <section class="briefing" aria-labelledby="briefing-title">
        <h2 class="visually-hidden" id="briefing-title">今日新闻简报</h2>
        <ol class="news-list is-loading" id="news-list" aria-busy="true">
          <li class="skeleton"><span></span></li>
          <li class="skeleton"><span></span></li>
          <li class="skeleton"><span></span></li>
          <li class="skeleton"><span></span></li>
          <li class="skeleton"><span></span></li>
          <li class="skeleton"><span></span></li>
        </ol>
        <noscript>
          <p class="notice">需要启用 JavaScript 才能读取今日简报。</p>
        </noscript>
      </section>

      <aside class="daily-note" id="daily-note" hidden>
        <p class="daily-note-label">每日微语</p>
        <blockquote id="daily-tip"></blockquote>
      </aside>
    </main>

    <footer>
      <p>保持好奇，也保持判断。</p>
      <p>
        数据由
        <a href="https://github.com/vikiboss/60s" target="_blank" rel="noopener noreferrer">60s API</a>
        提供
      </p>
    </footer>
  </body>
</html>
